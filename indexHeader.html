<!-- Header -->
<header class="bg-white rounded-xl shadow-sm mb-6 flex flex-col">
  <div class="flex justify-between items-center p-4 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-emerald-100 text-emerald-600 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900" id="header-title">Visão Geral de Investimentos</h1>
    </div>
    <div class="flex items-center gap-3">
      <select id="selectDate" onchange="filterByDate()" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2">
      </select>
    </div>
  </div>
  <div class="flex px-4 pt-2 gap-6">
    <button onclick="switchTab('summary')" id="btn-tab-summary" class="pb-3 px-2 text-emerald-600 font-semibold border-b-2 border-emerald-600 transition-colors">Resumo</button>
    <button onclick="switchTab('expenses')" id="btn-tab-expenses" class="pb-3 px-2 text-gray-500 hover:text-emerald-600 font-semibold border-b-2 border-transparent hover:border-gray-200 transition-colors">Despesas</button>
    <button onclick="switchTab('investments')" id="btn-tab-investments" class="pb-3 px-2 text-gray-500 hover:text-emerald-600 font-semibold border-b-2 border-transparent hover:border-gray-200 transition-colors">Investimentos</button>
  </div>
</header>
