<!-- Card 2: Gráfico de Evolução de Gastos -->
<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
  <h2 class="text-xs font-semibold uppercase text-gray-400 mb-2 tracking-wider">Evolução de Gastos</h2>
  <div class="h-44">
    <canvas id="expenseTrendChart"></canvas>
  </div>
</div>
<script>
    function processChart(response) {
      if (!response) return;

      allAssets = response.assets || [];

      var select = document.getElementById("selectDate");
      select.innerHTML = "";

      var availableDates = response.dates || [];
      let sortedList = sortDates(availableDates);

      if (sortedList.length > 0) {
        sortedList.forEach(function(date) {
          var option = document.createElement("option");
          option.value = date;
          option.text = date;
          select.appendChild(option);
        });

        filterByDate();
      } else {
        select.innerHTML = `<option value="">Nenhum período encontrado</option>`;
        document.getElementById("assetsTable").innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-400">Nenhum dado encontrado no Histórico.</td></tr>`;
      }

      var incomeValues = response.expenseTrend.labels.slice(-12).map(function(dateKey) {
          var key = dateKey.replace("/", "-").toUpperCase();
          return (allExpensesData.monthlyIncome && allExpensesData.monthlyIncome[key]) || 0;
        });

      if (response.expenseTrend) {
        renderChartExpenses(
          response.expenseTrend.labels.slice(-12), 
          response.expenseTrend.values.slice(-12),
          response.expenseTrend.segments,
          incomeValues
        );
      }
    }

    function renderChartExpenses(labels, values, segments, incomeValues) {
    var ctx = document.getElementById('expenseTrendChart').getContext('2d');
    
    if (expensesChart) {
      expensesChart.destroy();
    }

    expensesChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels.length > 0 ? labels : ['Sem Dados'],
        datasets: [
          {
          label: 'Gastos Totais',
          data: values.length > 0 ? values : [0],
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.08)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointBackgroundColor: '#ef4444'
        },
        {
          label: 'Renda Total',
          data: incomeValues.length > 0 ? incomeValues : [0],
          borderColor: '#f59e0b',
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.3,
          pointRadius: 4,
          pointBackgroundColor: '#f59e0b',
          borderDash: [5, 5]
        }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        customSegments: segments || {}, 
        plugins: { 
          legend: { 
              display: true,
              position: 'top',
              align: 'end',
              labels: {
                boxWidth: 12,
                font: { size: 10 }
              }
          },
          tooltip: {
            enabled: false, // Desativa a tooltip nativa
            external: externalTooltipHandler // Usa nosso renderizador customizado
          }
        },
        scales: {
          x: { grid: { display: false } },
          y: { 
            grid: { borderDash: [4, 4] },
            ticks: {
              callback: function(value) {
                return 'R$ ' + value;
              }
            }
          }
        }
      }
    });
  }

  function externalTooltipHandler(context) {
    var tooltipEl = document.getElementById('chartjs-tooltip');

    // 1. Cria o elemento div do tooltip caso ainda não exista no DOM
    if (!tooltipEl) {
      tooltipEl = document.createElement('div');
      tooltipEl.id = 'chartjs-tooltip';
      tooltipEl.style.background = 'rgba(15, 23, 42, 0.90)'; // Fundo escuro elegante (slate-900)
      tooltipEl.style.borderRadius = '10px';
      tooltipEl.style.color = '#ffffff';
      tooltipEl.style.opacity = '0';
      tooltipEl.style.pointerEvents = 'none';
      tooltipEl.style.position = 'absolute';
      tooltipEl.style.transition = 'all .15s ease';
      tooltipEl.style.padding = '10px 14px';
      tooltipEl.style.fontSize = '12px';
      tooltipEl.style.boxShadow = '0 10px 15px -3px rgba(0,0,0,0.3)';
      tooltipEl.style.zIndex = '100';
      document.body.appendChild(tooltipEl);
    }

    var tooltipModel = context.tooltip;

    // Esconde o tooltip se o mouse sair do ponto
    if (tooltipModel.opacity === 0) {
      tooltipEl.style.opacity = '0';
      return;
    }

    if (tooltipModel.body) {
      var dataIndex = tooltipModel.dataPoints[0].dataIndex;
      var chart = context.chart;

      var date = chart.data.labels[dataIndex];
      var valueTotalExpenses = chart.data.datasets[0].data[dataIndex];
      var valueTotalIncome = chart.data.datasets[1] ? (chart.data.datasets[1].data[dataIndex] || 0) : 0;
      var segmentDetails = chart.options.customSegments ? chart.options.customSegments[date] : null;

      // Cabeçalho do Tooltip
      var html = '<div style="font-weight: 700; font-size: 13px; margin-bottom: 6px; border-b: 1px solid rgba(255,255,255,0.1); pb: 4px;">Período: ' + date + '</div>';

      // Linha de Renda Total (Amarela)
      html += '<div style="display:flex; align-items:center; margin-bottom: 4px;">';
      html += '  <span style="display:inline-block; width:10px; height:10px; background:#f59e0b; border-radius:2px; margin-right:8px;"></span>';
      html += '  <span style="font-weight:600;">Renda Total: R$ ' + valueTotalIncome.toLocaleString('pt-BR', {minimumFractionDigits: 2}) + '</span>';
      html += '</div>';
      
      // Gastos Totais (Quadradinho Vermelho)
      html += '<div style="display:flex; align-items:center; margin-bottom: 6px;">';
      html += '  <span style="display:inline-block; width:10px; height:10px; background:#ef4444; border-radius:2px; margin-right:8px;"></span>';
      html += '  <span style="font-weight:600;">Gastos Totais: R$ ' + valueTotalExpenses.toLocaleString('pt-BR', {minimumFractionDigits: 2}) + '</span>';
      html += '</div>';

      // Detalhamento por Segmento (Quadradinhos de cores dinâmicas)
      if (segmentDetails && Object.keys(segmentDetails).length > 0) {
        html += '<div style="border-top: 1px solid rgba(255,255,255,0.15); padding-top: 6px; margin-top: 4px;">';
        html += '  <div style="color: #94a3b8; font-size: 11px; margin-bottom: 4px; font-weight: 600; uppercase">Por Segmento:</div>';
        
        // Paleta de cores Hexadecimal Tailwind para os segmentos
        var colorHex = ['#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ec4899', '#06b6d4', '#84cc16'];
        var idx = 0;

        for (var seg in segmentDetails) {
          var color = colorHex[idx % colorHex.length];
          var val = segmentDetails[seg];

          html += '<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top: 3px;">';
          html += '  <div style="display:flex; align-items:center;">';
          html += '    <span style="display:inline-block; width:8px; height:8px; background:' + color + '; border-radius:2px; margin-right:8px;"></span>';
          html += '    <span>' + seg + '</span>';
          html += '  </div>';
          html += '  <span style="font-weight:600;">R$ ' + val.toLocaleString('pt-BR', {minimumFractionDigits: 2}) + '</span>';
          html += '</div>';
          idx++;
        }
        html += '</div>';
      }

      tooltipEl.innerHTML = html;
    }

    // 2. Posicionamento do Tooltip em relação ao Canvas
    var position = context.chart.canvas.getBoundingClientRect();
    tooltipEl.style.opacity = '1';
    tooltipEl.style.left = position.left + window.pageXOffset + tooltipModel.caretX + 10 + 'px';
    tooltipEl.style.top = position.top + window.pageYOffset + tooltipModel.caretY - 20 + 'px';
  }
</script>
