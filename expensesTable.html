<!-- Card 4: Tabela de Despesas Editável -->
<div
  class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 lg:col-span-3"
>
  <div
    class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4"
  >
    <div>
      <h2 class="text-xs font-semibold uppercase text-gray-400 tracking-wider">
        Tabela de Despesas
      </h2>
      <p class="text-xs text-gray-500">
        Edite ou exclua despesas diretamente pelo período selecionado.
      </p>
    </div>
    <button
      onclick="addExpenseTableRow()"
      class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-4 py-2 rounded-xl transition"
    >
      Adicionar Linha
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead>
        <tr
          class="border-b border-gray-100 text-gray-400 font-medium text-xs uppercase"
        >
          <th class="pb-3">Gasto</th>
          <th class="pb-3">Valor</th>
          <th class="pb-3">Segmento</th>
          <th class="pb-3">Mês</th>
          <th class="pb-3">Ano</th>
          <th class="pb-3 text-center">Ação</th>
        </tr>
      </thead>
      <tbody
        id="expensesTableBody"
        class="divide-y divide-gray-50 text-gray-700"
      >
        <tr>
          <td colspan="6" class="py-4 text-center text-gray-400">
            Carregando dados das despesas...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-4 flex flex-col sm:flex-row justify-end gap-3">
    <button
      onclick="saveExpensesChanges()"
      class="w-full sm:w-auto px-5 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition"
    >
      Salvar Alterações
    </button>
  </div>
</div>
<script>
  var expensesRecordIdCounter = 1;

  function ensureExpenseRecordId(record) {
    if (!record.recordId) {
      record.recordId = "exp-" + expensesRecordIdCounter++;
    }
    return record.recordId;
  }

  function renderExpensesTable(filteredRecords) {
    var tbody = document.getElementById("expensesTableBody");
    if (!tbody) return;

    if (!Array.isArray(filteredRecords) || filteredRecords.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-400">Nenhum registro para o período selecionado.</td></tr>`;
      return;
    }

    var html = "";
    filteredRecords.forEach(function (item) {
      ensureExpenseRecordId(item);
      html += `<tr class="hover:bg-gray-50 transition">
        <td class="py-3 pr-2"><input data-record-id="${item.recordId}" data-field="description" value="${(item.expense || item.description || "").replace(/"/g, "&quot;")}" oninput="updateExpenseField(this)" class="w-full border border-gray-200 rounded-lg p-2 text-sm" /></td>
        <td class="py-3 pr-2"><input data-record-id="${item.recordId}" data-field="value" value="${parseFloat(item.value) || ""}" oninput="updateExpenseField(this)" type="number" step="0.01" class="w-full border border-gray-200 rounded-lg p-2 text-sm" /></td>
        <td class="py-3 pr-2"><input data-record-id="${item.recordId}" data-field="segment" value="${(item.segment || "").replace(/"/g, "&quot;")}" oninput="updateExpenseField(this)" class="w-full border border-gray-200 rounded-lg p-2 text-sm" /></td>
        <td class="py-3 pr-2"><input data-record-id="${item.recordId}" data-field="month" value="${(item.month || "").replace(/"/g, "&quot;")}" oninput="updateExpenseField(this)" class="w-full border border-gray-200 rounded-lg p-2 text-sm" /></td>
        <td class="py-3 pr-2"><input data-record-id="${item.recordId}" data-field="year" value="${(item.year || "").replace(/"/g, "&quot;")}" oninput="updateExpenseField(this)" class="w-full border border-gray-200 rounded-lg p-2 text-sm" /></td>
        <td class="py-3 text-center"><button onclick="removeExpenseTableRow('${item.recordId}')" class="text-red-500 hover:text-red-700 font-semibold">Excluir</button></td>
      </tr>`;
    });

    tbody.innerHTML = html;
  }

  function updateExpenseField(input) {
    var recordId = input.dataset.recordId;
    var field = input.dataset.field;
    var value = input.value;
    var index = allExpensesRecords.findIndex(function (item) {
      return item.recordId === recordId;
    });
    if (index === -1) return;
    if (field === "value") {
      allExpensesRecords[index][field] =
        value === "" ? "" : parseFloat(value) || 0;
    } else {
      allExpensesRecords[index][field] = value;
    }
  }

  function removeExpenseTableRow(recordId) {
    allExpensesRecords = allExpensesRecords.filter(function (item) {
      return item.recordId !== recordId;
    });
    filterByDate();
  }

  function addExpenseTableRow() {
    var select = document.getElementById("selectDate");
    var selectedPeriod = select ? select.value : "";
    var month = "";
    var year = "";
    if (selectedPeriod && selectedPeriod.indexOf("-") !== -1) {
      var parts = selectedPeriod.split("-");
      month = parts[0];
      year = parts[1];
    }
    var newRecord = {
      recordId: "exp-" + expensesRecordIdCounter++,
      expense: "",
      value: 0,
      segment: "Outros",
      month: month,
      year: year,
    };
    allExpensesRecords.push(newRecord);
    filterByDate();
  }

  function saveExpensesChanges() {
    var validRows = allExpensesRecords
      .filter(function (item) {
        return (
          item.expense &&
          item.expense.toString().trim() !== "" &&
          parseFloat(item.value) > 0 &&
          item.month &&
          item.year
        );
      })
      .map(function (item) {
        return {
          expense: item.expense || item.description || "",
          value: parseFloat(item.value) || 0,
          segment: item.segment || "Outros",
          month: item.month || "",
          year: item.year || "",
        };
      });

    if (!isAppsScriptEnvironment()) {
      allExpensesRecords = validRows.map(function (item) {
        return Object.assign({}, item, {
          recordId: "exp-" + expensesRecordIdCounter++,
        });
      });
      allExpensesData = computeSummaryPortfolio(
        allIncomingRecords,
        allExpensesRecords,
      );
      renderExpensesTable(filterExpensesByDate(selectedDateKey));
      updateExpensesSummary(selectedDateKey);
      alert("Alterações salvas localmente.");
      return;
    }

    google.script.run
      .withSuccessHandler(function () {
        allExpensesRecords = validRows.map(function (item) {
          return Object.assign({}, item, {
            recordId: "exp-" + expensesRecordIdCounter++,
          });
        });
        allExpensesData = computeSummaryPortfolio(
          allIncomingRecords,
          allExpensesRecords,
        );
        filterByDate();
        alert("Alterações de despesas salvas com sucesso.");
      })
      .withFailureHandler(function (err) {
        alert("Erro ao salvar alterações: " + err.message);
      })
      .saveExpensesData(validRows);
  }

  function filterExpensesByDate(selectedDate) {
    selectedDate =
      selectedDate || document.getElementById("selectDate")?.value || "";
    if (!selectedDate) return allExpensesRecords;
    return allExpensesRecords.filter(function (item) {
      var key = item.month ? item.month.toString().trim().toUpperCase() : "";
      var year = item.year ? item.year.toString().trim() : "";
      return key && year && key + "-" + year === selectedDate;
    });
  }
</script>
