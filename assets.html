<!-- Card 4: Tabela com Ativos + Dropdown Mês/Ano -->
<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 md:col-span-2 lg:col-span-3">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
    <div>
      <h2 class="text-xs font-semibold uppercase text-gray-400 tracking-wider">Meus Ativos (Histórico Ações)</h2>
      <p class="text-xs text-gray-500">Exibindo posições referentes ao período selecionado</p>
    </div>
    
    <!-- Dropdown Mês/Ano -->
    <div class="flex items-center gap-2">
      <label for="selectDate" class="text-xs font-semibold text-gray-600 uppercase">Período (Mês/Ano):</label>
      <select id="selectDate" onchange="filterByDate()" class="bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block p-2 font-medium">
        <option value="">Carregando...</option>
      </select>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead>
        <tr class="border-b border-gray-100 text-gray-400 font-medium text-xs uppercase">
          <th class="pb-3">Produto</th>
          <th class="pb-3">Grupo</th>
          <th class="pb-3">Investidos</th>
          <th class="pb-3">Rendimento Bruto</th>
          <th class="pb-3">Rentabilidade Bruta</th>
          <th class="pb-3">Saldo Bruto</th>
        </tr>
      </thead>
      <tbody id="assetsTable" class="divide-y divide-gray-50 text-gray-700">
        <tr>
          <td colspan="5" class="py-4 text-center text-gray-400">Carregando dados da planilha...</td>
        </tr>
      </tbody>
      <tfoot id="tfootAssets" class="border-t border-gray-200 font-bold text-gray-900 bg-gray-50/50">
        <!-- As somatórias da tabela entram aqui via JS -->
      </tfoot>
    </table>
  </div>
</div>
<!-- Modal Download Gastos -->
<div id="modalExpensesDownload" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md flex flex-col overflow-hidden">
    <div class="p-4 md:p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h3 class="font-bold text-gray-900 text-lg">Baixar Planilha de Gastos</h3>
      <button onclick="closeModalExpensesDownload()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
    </div>

    <div class="p-6">
      <p class="text-sm text-gray-600 mb-4">Escolha o formato em que deseja exportar os dados da aba <strong>expenses</strong>:</p>
      
      <div class="space-y-3">
        <label class="flex items-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition">
          <input type="radio" name="formatDownload" value="xlsx" checked class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
          <div class="ml-3">
            <span class="block text-sm font-semibold text-gray-800">Microsoft Excel (.xlsx)</span>
            <span class="block text-xs text-gray-500">Formato padrão para planilhas do Excel</span>
          </div>
        </label>

        <label class="flex items-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition">
          <input type="radio" name="formatDownload" value="csv" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
          <div class="ml-3">
            <span class="block text-sm font-semibold text-gray-800">Valores Separados por Vírgula (.csv)</span>
            <span class="block text-xs text-gray-500">Ideal para importar em outros sistemas</span>
          </div>
        </label>
      </div>

      <div class="mt-4 border-t border-gray-100 pt-4">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" id="requirePassword" onchange="document.getElementById('passwordFieldContainer').classList.toggle('hidden', !this.checked)" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 rounded border-gray-300">
          <span class="ml-2 text-sm font-semibold text-gray-800">Proteger com senha</span>
        </label>
        <div id="passwordFieldContainer" class="mt-3 hidden">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Senha</label>
          <input type="password" id="downloadPassword" class="w-full border border-gray-200 rounded-lg p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500" placeholder="Digite a senha">
        </div>
      </div>
    </div>

    <div class="p-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
      <button onclick="closeModalExpensesDownload()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-xl transition">Cancelar</button>
      <button onclick="expensesDownload()" id="btnConfirmDownload" class="px-5 py-2 text-sm font-medium bg-slate-800 hover:bg-slate-900 text-white rounded-xl shadow-sm transition flex items-center gap-2">
        <span>Baixar Arquivo</span>
      </button>
    </div>
  </div>
</div>
<script>
  function renderTable(data) {
    var htmlTable = "";
    var currentPosition = 0;
    var totalGrossProfit = 0;
    var totalInvested = 0;
    var sumGrossReturn = 0;
    var countGrossReturn = 0;

    if (data.length === 0) {
      document.getElementById("assetsTable").innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">Nenhum registro para o período selecionado.</td></tr>`;
      document.getElementById("tfootAssets").innerHTML = "";
      document.getElementById("totalPortfolio").innerText = "R$ 0,00";
      document.getElementById("totalGrossReturn").innerText = "R$ 0,00";
      return;
    }

    var avgGrossReturn = 0
    var countGrossReturn = 0
    for (var i = 0; i < data.length; i++) {
      var item = data[i];
      
      currentPosition += item.positionValue;
      totalGrossProfit += item.grossProfit;
      totalInvested += item.investedAmount;

      var grossReturnString = item.grossReturn;
      if (typeof grossReturnString === 'number') {
        avgGrossReturn += item.grossReturn * 100
        grossReturnString = (grossReturnString * 100).toFixed(2);
        countGrossReturn += 1
      }

      htmlTable += `<tr class="hover:bg-gray-50 transition">
        <td class="py-3 font-semibold text-gray-900">${item.product}</td>
        <td class="py-3"><span class="bg-gray-100 text-gray-600 px-2 py-1 rounded-md text-xs">${item.group || '-'}</span></td>
        <td class="py-3 ${item.investedAmount > 0 ? 'text-emerald-600' : 'text-gray-600'}">R$ ${item.investedAmount.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
        <td class="py-3 ${item.grossProfit >= 0 ? 'text-emerald-600' : 'text-red-500'}">R$ ${item.grossProfit.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
        <td class="py-3 ${Number(grossReturnString) >= 0 ? 'text-emerald-600' : 'text-red-500'}">${grossReturnString || '-'}%</td>
        <td class="py-3 font-medium">R$ ${item.positionValue.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
      </tr>`;
    }
    avgGrossReturn = (avgGrossReturn/countGrossReturn).toFixed(2)
    var htmlFoot = `<tr>
      <td class="py-3 uppercase text-xs">Total do Período</td>
      <td class="py-3"></td>
      <td class="py-3 ${totalInvested >= 0 ? 'text-emerald-600' : 'text-grey-600'}">R$ ${totalInvested.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
      <td class="py-3 ${totalGrossProfit >= 0 ? 'text-emerald-600' : 'text-red-500'}">R$ ${totalGrossProfit.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
      <td class="py-3 ${avgGrossReturn >= 0 ? 'text-emerald-600' : 'text-red-500'}"> ${avgGrossReturn.toLocaleString('pt-BR', {minimumFractionDigits: 2})}%</td>
      <td class="py-3">R$ ${currentPosition.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
    </tr>`;

    document.getElementById("assetsTable").innerHTML = htmlTable;
    document.getElementById("tfootAssets").innerHTML = htmlFoot;

    document.getElementById("totalPortfolio").innerText = "R$ " + currentPosition.toLocaleString('pt-BR', {minimumFractionDigits: 2});
    var elementGrossReturn = document.getElementById("totalGrossReturn");
    elementGrossReturn.innerText = "R$ " + totalGrossProfit.toLocaleString('pt-BR', {minimumFractionDigits: 2});
    if (totalGrossProfit < 0) {
      elementGrossReturn.classList.remove("text-emerald-600");
      elementGrossReturn.classList.add("text-red-500");
    } else {
      elementGrossReturn.classList.remove("text-red-500");
      elementGrossReturn.classList.add("text-emerald-600");
    }
  }
</script>
